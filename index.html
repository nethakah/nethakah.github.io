<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nethaka Haldo</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' text-anchor='middle' dominant-baseline='central' font-family='Georgia, serif' font-size='45' font-weight='500' fill='%23000'>NH</text></svg>">

<style>
:root {
    --bg: #7289DA;
    --text: #000;
    --muted: rgba(0,0,0,0.7);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    font-family: Georgia, serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* TOP BAR */
.top {
    position: fixed;
    top: 2rem;
    left: 2rem;
    right: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
}

/* LEFT CONTENT */
.info {
    max-width: 520px;
}

.name {
    font-size: 2.75rem;
    font-weight: 500;
    margin-bottom: 0.75rem;
}

.bio {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
}

.bio strong {
    color: var(--text);
}

/* BRACKET BUTTONS */
.links {
    margin-top: 0.75rem;
    display: flex;
    gap: 0.75rem;
    font-size: 0.9rem;
}

.links a {
    color: var(--muted);
    text-decoration: none;
}

.links a:hover {
    color: var(--text);
}

/* SKATE BUTTON */
.skate-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.35);
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.skate-btn svg {
    width: 26px;
    height: 26px;
    fill: #000;
}

/* SKATE AREA */
.skate-area {
    position: absolute;
    top: 55%;
    left: 0;
    width: 100%;
    height: 160px;
    overflow: hidden;
}

/* BOARD */
.board {
    position: absolute;
    left: -160px;
    bottom: 60px;
    width: 140px;
    height: 10px;
    background: #111;
    border-radius: 4px;
    transform-style: preserve-3d;
    animation: trick 4.8s linear forwards;
}

/* nose & tail bends */
.board::before,
.board::after {
    content: "";
    position: absolute;
    width: 30px;
    height: 10px;
    background: #111;
}

.board::before {
    left: -18px;
    transform: skewX(-18deg);
    border-radius: 4px 0 0 4px;
}

.board::after {
    right: -18px;
    transform: skewX(18deg);
    border-radius: 0 4px 4px 0;
}

/* WHEELS */
.wheel {
    position: absolute;
    bottom: -7px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
}

.wheel.front { left: 22px; }
.wheel.back { right: 22px; }

/* PHYSICS-BASED TRICK */
@keyframes trick {
    /* roll */
    0% {
        transform: translateX(0) translateY(0) rotateZ(0deg) rotateX(0deg);
    }

    /* tail pop */
    30% {
        transform: translateX(40vw) translateY(0) rotateZ(-8deg) rotateX(0deg);
    }

    /* ollie up */
    40% {
        transform: translateX(48vw) translateY(-55px) rotateZ(0deg) rotateX(0deg);
    }

    /* bone out + kickflip */
    55% {
        transform: translateX(60vw) translateY(-65px) rotateZ(2deg) rotateX(360deg);
    }

    /* descend */
    70% {
        transform: translateX(72vw) translateY(0) rotateZ(0deg) rotateX(360deg);
    }

    /* roll out */
    100% {
        transform: translateX(88vw) translateY(0) rotateZ(0deg) rotateX(360deg);
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="info">
        <div class="name">Nethaka Haldo</div>
        <div class="bio">
            I’m a U.S. Citizen and undergraduate
            <strong>Electrical &amp; Computer Engineering</strong> student at
            <strong>Carnegie Mellon University</strong>.
            I’m interested in helping people through AI, hardware, software, and skateboarding.
        </div>
        <div class="links">
            <a href="mailto:nethaka.haldo@gmail.com">[Email]</a>
            <a href="https://linkedin.com/in/nethaka" target="_blank">[LinkedIn]</a>
            <a href="https://github.com/nethakah" target="_blank">[GitHub]</a>
        </div>
    </div>

    <button class="skate-btn" id="replay" title="Replay">
        <!-- simple skateboard icon -->
        <svg viewBox="0 0 64 24">
            <rect x="4" y="6" width="56" height="6" rx="3"/>
            <circle cx="18" cy="18" r="3"/>
            <circle cx="46" cy="18" r="3"/>
        </svg>
    </button>
</div>

<div class="skate-area">
    <div class="board" id="board">
        <div class="wheel front"></div>
        <div class="wheel back"></div>
    </div>
</div>

<script>
const board = document.getElementById("board");
const replay = document.getElementById("replay");

replay.addEventListener("click", () => {
    board.style.animation = "none";
    board.offsetHeight;
    board.style.animation = "trick 4.8s linear forwards";
});
</script>

</body>
</html>
