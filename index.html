<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nethaka Haldo</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' text-anchor='middle' dominant-baseline='central' font-family='Outfit, sans-serif' font-size='45' font-weight='500' fill='%23fafafa'>NH</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #7289DA;
    --text: #fafafa;
    --muted: rgba(255,255,255,0.75);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* CENTER LAYOUT (Rowan-style) */
.main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1.25rem;
    text-align: center;
}

/* NAME */
.name {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4.25rem);
    font-weight: 500;
    letter-spacing: -0.03em;
}

/* ABOUT */
.about {
    max-width: 620px;
    font-size: 1rem;
    color: var(--muted);
}

.about strong {
    color: var(--text);
    font-weight: 500;
}

/* BRACKET BUTTONS */
.buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.9rem;
}

.buttons a,
.buttons button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
}

.buttons a:hover,
.buttons button:hover {
    color: var(--text);
}

/* SKATE ANIMATION */
.skate-wrapper {
    position: relative;
    width: 100%;
    height: 120px;
    overflow: hidden;
    margin-top: 1.5rem;
}

.board {
    position: absolute;
    left: -120px;
    bottom: 35px;
    width: 120px;
    height: 12px;              /* thinner deck */
    background: #111;
    border-radius: 10px;
    animation: kickflip 5.5s ease-in-out forwards;
    transform-style: preserve-3d;
}

.board::before,
.board::after {
    content: "";
    position: absolute;
    bottom: -6px;
    width: 12px;
    height: 12px;
    background: #222;
    border-radius: 50%;
}

.board::before { left: 20px; }
.board::after { right: 20px; }

/* REALISTIC KICKFLIP:
   - roll
   - ollie pop (translateY)
   - rotateX 360 (long-axis flip)
   - land
*/
@keyframes kickflip {
    0% {
        transform: translateX(0) translateY(0) rotateX(0deg);
    }
    35% {
        transform: translateX(45vw) translateY(0) rotateX(0deg);
    }
    45% {
        transform: translateX(50vw) translateY(-55px) rotateX(0deg);
    }
    60% {
        transform: translateX(58vw) translateY(-55px) rotateX(360deg);
    }
    75% {
        transform: translateX(65vw) translateY(0) rotateX(360deg);
    }
    100% {
        transform: translateX(80vw) translateY(0) rotateX(360deg);
    }
}

footer {
    position: fixed;
    bottom: 1rem;
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
}
</style>
</head>

<body>

<div class="main">
    <div class="name">Nethaka Haldo</div>

    <div class="about">
        I’m a U.S. Citizen and undergraduate
        <strong>Electrical &amp; Computer Engineering</strong> student at
        <strong>Carnegie Mellon University</strong>.
        I’m interested in helping people through AI, hardware, software, and skateboarding.
    </div>

    <div class="buttons">
        <a href="https://github.com/nethakah" target="_blank">[ github ]</a>
        <a href="https://linkedin.com/in/nethaka" target="_blank">[ linkedin ]</a>
        <a href="mailto:nethaka.haldo@gmail.com">[ email ]</a>
        <button id="replay">[ season ]</button>
    </div>

    <div class="skate-wrapper">
        <div id="board" class="board"></div>
    </div>
</div>

<footer>© 2025 Nethaka Haldo</footer>

<script>
const board = document.getElementById("board");
const replay = document.getElementById("replay");

replay.addEventListener("click", () => {
    board.style.animation = "none";
    board.offsetHeight; // reflow
    board.style.animation = "kickflip 5.5s ease-in-out forwards";
});
</script>

</body>
</html>
