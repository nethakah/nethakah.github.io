<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nethaka Haldo</title>

<style>
:root {
    --bg: #7289DA;
    --text: #fff;
    --muted: rgba(255,255,255,0.75);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    font-family: Georgia, serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* TOP LAYOUT */
.top {
    position: fixed;
    top: 2rem;
    left: 2rem;
    right: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

/* LEFT INFO */
.info {
    max-width: 520px;
}

.name {
    font-size: 2.1rem;
    font-weight: 500;
    margin-bottom: 0.6rem;
}

.bio {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--muted);
}

.bio strong {
    color: var(--text);
    font-weight: 500;
}

/* LINKS */
.links {
    margin-top: 0.6rem;
    display: flex;
    gap: 0.7rem;
    font-size: 0.8rem;
}

.links a {
    color: var(--muted);
    text-decoration: none;
}

.links a:hover {
    color: var(--text);
}

/* REPLAY BUTTON */
.skate-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.skate-btn svg {
    width: 24px;
    height: 24px;
    fill: #000;
}

/* SKATE AREA */
.skate-area {
    position: absolute;
    top: 55%;
    width: 100%;
    height: 160px;
    overflow: hidden;
}

/* BOARD */
.board {
    position: absolute;
    left: -160px;
    bottom: 60px;
    width: 140px;
    height: 9px;
    background: #111;
    border-radius: 3px;
    transform-style: preserve-3d;
    animation: trick 4.6s linear forwards;
}

/* nose & tail (bent up permanently) */
.board::before,
.board::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 9px;
    background: #111;
}

.board::before {
    left: -18px;
    transform: rotateZ(-10deg);
    border-radius: 4px 0 0 4px;
}

.board::after {
    right: -18px;
    transform: rotateZ(10deg);
    border-radius: 0 4px 4px 0;
}

/* wheels */
.wheel {
    position: absolute;
    bottom: -6px;
    width: 11px;
    height: 11px;
    background: #fff;
    border-radius: 50%;
}

.wheel.front { left: 22px; }
.wheel.back { right: 22px; }

/* PHYSICS-CORRECT TRICK */
@keyframes trick {
    /* roll flat */
    0% {
        transform: translateX(0) translateY(0) rotateZ(0deg) rotateX(0deg);
    }

    /* still flat */
    32% {
        transform: translateX(42vw) translateY(0) rotateZ(0deg) rotateX(0deg);
    }

    /* POP (tail dip happens here) */
    38% {
        transform: translateX(48vw) translateY(-55px) rotateZ(-7deg) rotateX(0deg);
    }

    /* bone out + kickflip */
    55% {
        transform: translateX(60vw) translateY(-65px) rotateZ(0deg) rotateX(360deg);
    }

    /* land flat */
    70% {
        transform: translateX(72vw) translateY(0) rotateZ(0deg) rotateX(360deg);
    }

    /* roll out */
    100% {
        transform: translateX(88vw) translateY(0) rotateZ(0deg) rotateX(360deg);
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="info">
        <div class="name">Nethaka Haldo</div>
        <div class="bio">
            I’m a U.S. Citizen and undergraduate
            <strong>Electrical &amp; Computer Engineering</strong> student at
            <strong>Carnegie Mellon University</strong>.
            I’m interested in helping people through AI, hardware, software, and skateboarding.
        </div>
        <div class="links">
            <a href="mailto:nethaka.haldo@gmail.com">[Email]</a>
            <a href="https://linkedin.com/in/nethaka" target="_blank">[LinkedIn]</a>
            <a href="https://github.com/nethakah" target="_blank">[GitHub]</a>
        </div>
    </div>

    <button class="skate-btn" id="replay" title="Replay">
        <svg viewBox="0 0 64 24">
            <rect x="4" y="6" width="56" height="6" rx="3"/>
            <circle cx="18" cy="18" r="3"/>
            <circle cx="46" cy="18" r="3"/>
        </svg>
    </button>
</div>

<div class="skate-area">
    <div class="board" id="board">
        <div class="wheel front"></div>
        <div class="wheel back"></div>
    </div>
</div>

<script>
const board = document.getElementById("board");
const replay = document.getElementById("replay");

replay.addEventListener("click", () => {
    board.style.animation = "none";
    board.offsetHeight;
    board.style.animation = "trick 4.6s linear forwards";
});
</script>

</body>
</html>
