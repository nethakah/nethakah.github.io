<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nethaka Haldo</title>

<!-- NH FAVICON -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='55' text-anchor='middle' dominant-baseline='middle' font-family='Georgia, serif' font-size='44' font-weight='500' fill='%23ffffff'>NH</text></svg>">

<style>
:root {
    --bg: #7289DA;
    --text: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    font-family: Georgia, serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* TOP LAYOUT */
.top {
    position: fixed;
    top: 2rem;
    left: 2rem;
    right: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

/* LEFT INFO */
.info {
    max-width: 540px;
}

/* NAME (smaller) */
.name {
    font-size: 1.6rem;
    font-weight: 500;
    margin-bottom: 0.6rem;
}

/* BIO (slightly larger) */
.bio {
    font-size: 0.95rem;
    line-height: 1.65;
}

/* LINKS (bold & white) */
.links {
    margin-top: 0.75rem;
    display: flex;
    gap: 0.9rem;
    font-size: 0.95rem;
}

.links a {
    color: #fff;
    font-weight: 700;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

/* SKATE BUTTON */
.skate-btn {
    background: none;
    border: none;
    color: #fff;
    font-family: Georgia, serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
}

/* SKATE AREA */
.skate-area {
    position: absolute;
    top: 55%;
    width: 100%;
    height: 160px;
    overflow: hidden;
}

/* BOARD (short, straight) */
.board {
    position: absolute;
    left: -120px;
    bottom: 60px;
    width: 110px;
    height: 8px;
    background: #111;
    border-radius: 4px;
    transform-style: preserve-3d;
    animation: trick 4.6s linear forwards;
}

/* WHEELS (white) */
.wheel {
    position: absolute;
    bottom: -6px;
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
}

.wheel.front { left: 18px; }
.wheel.back { right: 18px; }

/* REALISTIC TRICK */
@keyframes trick {
    /* roll flat */
    0% {
        transform: translateX(0) translateY(0) rotateZ(0deg) rotateX(0deg);
    }

    /* still flat */
    32% {
        transform: translateX(42vw) translateY(0) rotateZ(0deg) rotateX(0deg);
    }

    /* pop */
    38% {
        transform: translateX(48vw) translateY(-50px) rotateZ(-7deg) rotateX(0deg);
    }

    /* kickflip */
    55% {
        transform: translateX(60vw) translateY(-60px) rotateZ(0deg) rotateX(360deg);
    }

    /* land */
    70% {
        transform: translateX(72vw) translateY(0) rotateZ(0deg) rotateX(360deg);
    }

    /* roll out */
    100% {
        transform: translateX(88vw) translateY(0) rotateZ(0deg) rotateX(360deg);
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="info">
        <div class="name">Nethaka Haldo</div>
        <div class="bio">
            I’m a U.S. Citizen and undergraduate
            <strong>Electrical &amp; Computer Engineering</strong> student at
            <strong>Carnegie Mellon University</strong>.
            I’m interested in helping people through advancing AI, hardware, and software. I like skateboarding and playing cello in my free time.
        </div>
        <div class="links">
            <a href="mailto:nethaka.haldo@gmail.com">[Email]</a>
            <a href="https://linkedin.com/in/nethaka" target="_blank">[LinkedIn]</a>
            <a href="https://github.com/nethakah" target="_blank">[GitHub]</a>
        </div>
    </div>

    <button class="skate-btn" id="replay">[Skate]</button>
</div>

<div class="skate-area">
    <div class="board" id="board">
        <div class="wheel front"></div>
        <div class="wheel back"></div>
    </div>
</div>

<script>
const board = document.getElementById("board");
const replay = document.getElementById("replay");

replay.addEventListener("click", () => {
    board.style.animation = "none";
    board.offsetHeight; // force reflow
    board.style.animation = "trick 4.6s linear forwards";
});
</script>

</body>
</html>
